apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-dev-root-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/yoooooungwoon/gitops-test
    targetRevision: main
    path: applicationsets/onprem-dev
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true